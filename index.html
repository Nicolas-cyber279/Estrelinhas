<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Nicolas 'The Best' Da Silva Valadares">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Grupo The Bests</title>
</head>

<body>

    <main class="pagina">
        <input class="inputs-fase" type="radio" name="phase" id="phase1" checked>
        <input class="inputs-fase" type="radio" name="phase" id="phase2">
        <div class="palco">
            <div class="giro">
                <section class="face face-login">
                    <div class="conteudo">
                        <div class="conteudo-principal">
                            <section class="apresentacao">
                                <h1>Login</h1>
                                <p>
                                    Bem-vindo de volta. Faça login para acessar sua conta.
                                </p>
                            </section>
                            <section class="formulario">
                                <div id="formLogin">
                                    <form action="">
                                        <div class="campo">
                                            <label for="inpEmail">
                                                Email
                                            </label>
                                            <input type="email" id="inpEmail" name="email" placeholder="Seu email"
                                                autocomplete="email" required>
                                        </div>
                                        <div class="campo">
                                            <label for="inpSenha">
                                                Senha
                                            </label>
                                            <input type="password" id="inpSenha" name="senha" placeholder="Sua senha"
                                                autocomplete="current-password" required>
                                        </div>
                                        <div class="lembrar">
                                            <input type="checkbox" id="LembrarCheck" name="lembrar">
                                            <label for="LembrarCheck">
                                                Lembrar de mim
                                            </label>
                                        </div>
                                        <button type="button" id="btnLogin" onclick="Logar()">
                                            Entrar
                                        </button>
                                    </form>
                                </div>
                                <p class="alternar">
                                    Ainda não possui uma conta?
                                    <label for="phase2">
                                        Criar conta
                                    </label>
                                </p>
                            </section>
                        </div>
                </section>
                <section class="face face-cadastro">
                    <div class="conteudo">
                        <div class="conteudo-principal">
                            <section class="apresentacao">
                                <h1>Crie sua conta</h1>
                                <p>
                                    Faça parte da nossa comunidade e compartilhe novas experiências.
                                </p>
                            </section>
                            <section class="formulario formulario-cadastro">
                                <div id="formCadastro">
                                    <form action="">
                                        <div class="campo">
                                            <label for="inpNomeCadastro">
                                                Nome
                                            </label>
                                            <input type="text" id="inpNomeCadastro" name="nome" placeholder="Seu nome"
                                                autocomplete="name" required>
                                        </div>
                                        <div class="campo">
                                            <label for="inpEmailCadastro">
                                                Email
                                            </label>
                                            <input type="email" id="inpEmailCadastro" name="emailCadastro"
                                                placeholder="Seu email" autocomplete="email" required>
                                        </div>
                                        <div class="campo">
                                            <label for="inpSenhaCadastro">
                                                Senha
                                            </label>
                                            <input type="password" id="inpSenhaCadastro" name="senhaCadastro"
                                                placeholder="Crie uma senha" autocomplete="new-password" required>
                                        </div>
                                        <div class="campo">
                                            <label for="inpConfSenhaCadastro">
                                                Confirme sua senha
                                            </label>
                                            <input type="password" id="inpConfSenhaCadastro" name="confirmarSenha"
                                                placeholder="Confirme sua senha" autocomplete="new-password" required>
                                        </div>
                                        <button type="button" id="btnCadastro" onclick="Cadastrar()">
                                            Criar minha conta
                                        </button>
                                    </form>
                                </div>
                                <p class="alternar">
                                    Já possui uma conta?
                                    <label for="phase1">
                                        Fazer login
                                    </label>
                                </p>
                            </section>
                        </div>
                        <footer class="rodape">
                            <span>COMUNIDADE THE BESTS</span>
                            <span>
                                Criado por <strong>THE BESTS ⭐</strong>
                            </span>
                        </footer>
                    </div>
                </section>
            </div>
        </div>
    </main>

</body>

</html>
